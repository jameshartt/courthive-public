# DRAFT, never run. Bundle image for jim-dot-tennis (see BUNDLE.md).
# Push to jdt-bundle or a pull request into it: guard, project checks, image build.
# Tag bundle-v<upstream version>-jdt.<n>: the same, then push to GHCR as
# <upstream version>-jdt.<n>. Checkout / pnpm / setup-node versions match
# upstream's ci.yml (checkout@v7, pnpm/action-setup@v6, setup-node@v7 with
# .node-version). The docker/* action versions were not checked against a
# current release list. Upstream's ci.yml strips link: overrides and deletes the
# lockfile before installing; this workflow instead refuses link: entries and
# installs from the committed lockfile, which is what the image builds from.
#
# Checks verified locally on upstream 1.23.7 + this branch (node 26, pnpm 12.21.0,
# in Docker): lint, format:check, check-types and unit tests pass. e2e (Playwright)
# is not run here; upstream's ci.yml runs it.
name: bundle-image

on:
  push:
    branches: [jdt-bundle]
    tags: ['bundle-v*']
  pull_request:
    branches: [jdt-bundle]

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Guard against link: dependencies and overrides
        run: node bundle/check-links.mjs
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - name: Project checks
        run: pnpm lint && pnpm format:check && pnpm check-types && pnpm test --run
      - name: Build arguments
        id: args
        run: |
          . ./bundle/UPSTREAM
          git merge-base --is-ancestor "$UPSTREAM_COMMIT" HEAD || { echo "::error::bundle/UPSTREAM commit is not an ancestor of HEAD"; exit 1; }
          uv=$(node -p "require('./package.json').version")
          if [[ "$GITHUB_REF" == refs/tags/bundle-v* ]]; then
            version="${GITHUB_REF#refs/tags/bundle-v}"
            [[ "$version" == "$uv"-jdt.* ]] || { echo "::error::tag $version does not start with $uv-jdt."; exit 1; }
          else
            version="$uv-jdt.0-ci"
          fi
          { echo "version=$version"; echo "uv=$uv"; echo "commit=$UPSTREAM_COMMIT"
            echo "repo=$UPSTREAM_REPO"; echo "fork=$FORK_REPO"; echo "image=$IMAGE"; } >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - if: startsWith(github.ref, 'refs/tags/bundle-v')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ startsWith(github.ref, 'refs/tags/bundle-v') }}
          tags: ${{ steps.args.outputs.image }}:${{ steps.args.outputs.version }}
          build-args: |
            VERSION=${{ steps.args.outputs.version }}
            UPSTREAM_VERSION=${{ steps.args.outputs.uv }}
            UPSTREAM_COMMIT=${{ steps.args.outputs.commit }}
            UPSTREAM_REPO=${{ steps.args.outputs.repo }}
            FORK_REPO=${{ steps.args.outputs.fork }}
            FORK_COMMIT=${{ github.sha }}
