<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- IE -->
    <link rel="shortcut icon" type="image/x-icon" href="src/assets/icons/favicon/favicon.ico" />
    <!-- other browsers -->
    <link rel="icon" type="image/x-icon" href="src/assets/icons/favicon/favicon.ico" />
    <title>Public</title>
  </head>
  <body>
    <!-- Club-neutral bundle: every service address is a path on the host that
         serves this page, so one build works under any hostname and never
         falls back to courthive.net. The services read window.dev before
         their localhost / courthive.net fallbacks. -->
    <script>
      (function () {
        var api = location.origin + '/api/courthive';
        window.dev = window.dev || {
          baseURL: api,
          authURL: api,
          amsURL: api + '/ams',
          declarationsURL: api + '/declarations',
          queryBaseURL: api + '/query',
        };
      })();
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
